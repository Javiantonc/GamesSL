const SHAPES = {

  staff: { orbe: 'Bastón', cristal: 'Báculo de cristal', llama: 'Cetro llameante', luna: 'Báculo lunar' },
  mace: { bola: 'Maza', estrella: 'Lucero del alba', martillo: 'Martillo de guerra' },

  // carteles en los caminos
  for (const [x, y, t] of [[CX + 90, CY - 700, 'Bosque ↑'], [CX + 950, CY + 160, 'Colinas →'], [CX + 90, CY + 760, 'Lagos ↓'], [CX - 950, CY + 160, '← Pradera']]) place(S, signArt(t), x, y, { w: 90, h: 70, solid: [-6, -8, 12, 8], shadow: 20 });

    S.portals.push(p);
  }

  const r = wrng(91);
  const occ = new Map(), okSpot = (x, y, sx, sy) => {
    const ci = Math.floor(x / 200), cj = Math.floor(y / 200);
    for (let i = ci - 1; i <= ci + 1; i++) for (let j = cj - 1; j <= cj + 1; j++) for (const o of occ.get(i + ',' + j) || []) if (Math.abs(o[0] - x) < sx && Math.abs(o[1] - y) < sy) return false;
    return true;
  };
  const mark = (x, y) => { const k = Math.floor(x / 200) + ',' + Math.floor(y / 200); if (!occ.has(k)) occ.set(k, []); occ.get(k).push([x, y]); };
  const free = (x, y, m = 40) => !villageZone(x, y, 0.95) && !onPath(x, y, m) && !inLake(x, y, 80) && !PORTALS.some((p) => Math.abs(p.x - x) < 170 && Math.abs(p.y - y) < 150);

  for (let n = 0, tries = 0; n < 170 && tries < 20000; tries++) {
    const x = 100 + r() * (WORLD_W - 200), y = 200 + r() * (WORLD_H - 260), z = zoneAt(x, y);
    if (!free(x, y, 60) || !okSpot(x, y, 110, 80)) continue;

  for (let n = 0, tries = 0; n < 190 && tries < 20000; tries++) {

  }
  LAKES.forEach((L, li) => {
    const n = li === 0 ? 3 : 2 + Math.floor(L.rx / 160);

  });
}

/* -------------------------------------------------------------- diálogo */

/* -------------------------------------------------------------- combate */
const lvlMul = () => 1 + (hero.lvl - 1) * 0.15;

/** Autoapuntado: mantiene el objetivo fijado; si no hay, elige el enemigo más cercano
 *  (prefiere los que te atacan antes que los animales tranquilos). */
function nearestMob(r) {
  const t = hero.target;
  if (t && !t.dead && mobs.includes(t) && Math.hypot(t.x - hero.x, t.y - hero.y) < r * 1.3) return t;
  let best = null, bd = Infinity;
  for (const m of mobs) {
    if (m.dead) continue;
    const d = Math.hypot(m.x - hero.x, m.y - hero.y); if (d > r) continue;
    const score = d - (m.state === 'chase' ? 140 : 0) + (MONSTERS[m.type].passive && m.state === 'idle' ? 60 : 0);
    if (score < bd) { bd = score; best = m; }

}
function cycleTarget() {
  const list = mobs.filter((m) => !m.dead && Math.hypot(m.x - hero.x, m.y - hero.y) < 420).sort((a, b) => Math.hypot(a.x - hero.x, a.y - hero.y) - Math.hypot(b.x - hero.x, b.y - hero.y));

}
let CAM = { x: 0, y: 0 };
function faceTo(x, y) { const dx = x - hero.x, dy = y - hero.y; if (Math.abs(dx) > Math.abs(dy)) { hero.dir = 2; hero.flip = dx < 0; } else hero.dir = dy < 0 ? 1 : 0; }
const facingVec = () => (hero.dir === 2 ? [hero.flip ? -1 : 1, 0] : hero.dir === 1 ? [0, -1] : [0, 1]);
function damageMob(m, n, color = '#ffe46a') {
  if (m.dead) return;

  m.hp -= n; m.hit = 0.12;
  if (m.state === 'idle' || m.state === 'back') { m.state = MONSTERS[m.type].flee ? 'flee' : 'chase'; m.fleeT = T + 4; }
  nums.push({ x: m.x, y: m.y - 50, t: 0, txt: n, c: color });

}

/* ------------------------------------------------------------ actualizar */
let last = performance.now(), T = 0;
const START = { x: CX, y: CY + 160 };
function update(dt) {
  let mx = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
  let my = (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0) - (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0);
  if (joy.x || joy.y) { mx = joy.x; my = joy.y; }
  const len = Math.hypot(mx, my);
  hero.moving = len > 0.2 && !hero.dead;
  if (hero.moving) {
    const sp = SPD * (hero.speedUp && hero.speedUp.until > T ? hero.speedUp.v : 1) * dt / Math.max(1, len);
    const nx = hero.x + mx * sp, ny = hero.y + my * sp;
    if (!blocked(nx, hero.y)) hero.x = nx;
    if (!blocked(hero.x, ny)) hero.y = ny;
    if (hero.atkT <= 0) { if (Math.abs(mx) > Math.abs(my)) { hero.dir = 2; hero.flip = mx < 0; } else hero.dir = my < 0 ? 1 : 0; }
    hero.ft += dt * 7; hero.frame = Math.floor(hero.ft) % 4;
    if (hero.gather) { hero.gather = null; gbar.style.display = 'none'; }
    if (talkingTo && Math.hypot(talkingTo.x - hero.x, talkingTo.y - hero.y) > 100) { talkingTo = null; talkEl.style.display = 'none'; }
  } else { hero.frame = 0; hero.ft = 0; }
  hero.atkT -= dt; hero.hurt -= dt; hero.spin = Math.max(0, (hero.spin || 0) - dt);
  if (hero.regen && T < hero.regen.until && !hero.dead) hero.hp = Math.min(hero.max, hero.hp + hero.regen.per * dt);
  if (hero.buff && T > hero.buff.until) { hero.buff = null; recalc(); toast('Ya no estás bien alimentado'); }
  if (T - (hero.lastHit || -99) > 5 && !hero.dead) hero.hp = Math.min(hero.max, hero.hp + hero.max * 0.04 * dt);

  updateWorldStuff(dt); updateZones(dt);
  for (const m of mobs) {
    if (!m.dead && m.state === 'idle' && Math.abs(m.x - hero.x) + Math.abs(m.y - hero.y) > 1600) continue;
    if (m.dead) { if (T > m.respawn && (!m.loot || !m.loot.length || T - m.deadAt > 60) && Math.hypot(m.hx - hero.x, m.hy - hero.y) > 400) { Object.assign(m, { dead: false, hp: m.max, x: m.hx, y: m.hy, state: 'idle', dots: [], loot: null }); if (lootOf === m) closeLoot(); } continue; }
    for (let i = m.dots.length - 1; i >= 0; i--) { const d = m.dots[i]; if (T >= d.next) { d.next += 1; d.n--; damageMob(m, d.d, d.c); } if (d.n <= 0) m.dots.splice(i, 1); }
    if (m.dead) continue;
    if (m.stunT > T) { m.hit -= dt; continue; }
    m.t += dt; m.hit -= dt; m.jump = Math.max(0, (m.jump || 0) - dt);
    const dx = hero.x - m.x, dy = hero.y - m.y, d = Math.hypot(dx, dy);
    if (m.state === 'idle') {

      if (m.t > 3) { m.t = 0; m.tx = m.hx + (Math.random() - 0.5) * 120; m.ty = m.hy + (Math.random() - 0.5) * 90; }

    } else if (m.state === 'flee') {

    } else {

  for (let i = shots.length - 1; i >= 0; i--) {

    if (s.tg && !s.tg.dead) {   // proyectil teledirigido hacia su objetivo

'use strict';

const winEl = document.getElementById('win'), gbar = document.getElementById('gbar');

/* ---------------------------------------------------------------- escenas */

  shots.length = 0; closeLoot(); closeWin();

}
function onBossKilled(m) {
  const P = SC.portal, first = !hero.done[P.i];
  hero.done[P.i] = true;
  timers.push({ t: T, fn: () => {
    m.loot.push({ kind: 'gold', n: (first ? 40 : 15) + P.lvl * (first ? 12 : 5) });
    m.loot.push({ kind: 'weapon', w: makeWeapon(hero.cls, P.lvl + 1, Math.min(4, Math.max(2, rollRarity(40)) + (first && P.i >= 6 ? 1 : 0))) });
    m.loot.push({ kind: 'potion', icon: '🧪', name: 'Poción de vida', n: 2 });
  } });
  const R = SC.bossRoom, d = { x: R.x + R.w / 2, y: R.y + R.h - 50, exit: 'dungeon' };
  SC.doors.push(d); place(SC, portalArt(P.col), d.x, d.y, { w: 120, h: 128, portal: { col: P.col } });
  nums.push({ x: m.x, y: m.y - 170, t: 0, txt: `¡${m.name} derrotado!`, c: '#ffb0ff', big: true });
  toast(`🏆 <b>¡Mazmorra ${P.name} completada!</b>${first ? ' Primera vez: botín extra.' : ''} Saquea al guardián y sal por el portal.`);

}

/* ------------------------------------------------------- acción contextual */
const NODE_PROF = { ore: 'mineria', herb: 'herbo', fish: 'pesca' };
const NODE_VERB = { ore: ['⛏️', 'Picar'], herb: ['🌿', 'Recoger'], fish: ['🎣', 'Pescar'] };
function nearAct() {
  if (!hero || hero.dead) return null;
  const d = (x, y) => Math.hypot(x - hero.x, y - hero.y);
  const c = nearCorpse(); if (c) return { icon: '💰', text: 'Saquear', x: c.x, y: c.y, ref: c, fn: () => openLoot(c) };
  const n = nearNpc(); if (n) return { icon: '💬', text: 'Hablar', x: n.x, y: n.y, ref: n, fn: talk };
  for (const dr of SC.doors) if (d(dr.x, dr.y) < 62) return { icon: '🚪', text: SC.kind === 'world' ? `Entrar · ${ROOMS[dr.room].name}` : 'Salir', x: dr.x, y: dr.y, ref: dr, fn: () => enterDoor(dr) };
  for (const p of SC.portals) if (d(p.x, p.y) < 95) return { icon: '🌀', text: `Entrar · Mazmorra ${p.name}`, x: p.x, y: p.y, ref: p, fn: () => enterPortal(p) };
  let best = null, bd = 88;
  for (const nd of SC.nodes) if (T > nd.ready) { const dd = d(nd.x, nd.y); if (dd < bd) { bd = dd; best = nd; } }
  if (best) { const [ic, v] = NODE_VERB[best.kind]; return { icon: ic, text: `${v} · ${resName(best.kind, best.tier)}`, x: best.x, y: best.y, ref: best, fn: () => startGather(best) }; }
  return null;
}
function doAct() {
  if (!playing) return;
  if (winEl.classList.contains('open')) { closeWin(); return; }
  if (talkingTo) { talk(); return; }

}
function faceNpc(n) { const dx = hero.x - n.x, dy = hero.y - n.y; n.dir = Math.abs(dx) > Math.abs(dy) ? 2 : dy < 0 ? 1 : 0; n.flip = dx < 0; }

/* ---------------------------------------------------- recursos y bolsa */
const resKey = (kind, t) => kind + t;
const resN = (kind, t) => hero.res[resKey(kind, t)] || 0;
function addRes(kind, t, n) { hero.res[resKey(kind, t)] = resN(kind, t) + n; if (hero.res[resKey(kind, t)] <= 0) delete hero.res[resKey(kind, t)]; }
function resList() { return Object.entries(hero.res).map(([k, n]) => { const kind = k.slice(0, -1), t = +k.slice(-1); return { kind, t, n, name: resName(kind, t), icon: RES_ICON[kind], col: RES[kind][t][1] }; }); }

/* ---------------------------------------------------------- recolectar */
function startGather(nd) {
  const pid = NODE_PROF[nd.kind], P = PROFS[pid], pr = hero.profs[pid];
  if (!pr) { toast(`Necesitas la profesión <b>${P.icon} ${P.name}</b>. Te la enseña ${trainerName(pid)}.`); return; }
  if (!hero.tools[P.tool]) { toast(`Necesitas <b>${P.tool}</b>. Cómprala a Tobías (mercader) o a tu instructor.`); return; }
  if (pr.r < nd.tier) { toast(`${resName(nd.kind, nd.tier)} requiere ${P.name} rango ${nd.tier} (${RANKS[nd.tier]}). Tú eres ${RANKS[pr.r]}.`); return; }
  hero.gather = { nd, p: 0 }; faceTo(nd.x, nd.y);
  gbar.style.display = 'block'; gbar.querySelector('span').textContent = `${NODE_VERB[nd.kind][1]}…`;
}
function finishGather() {
  const nd = hero.gather.nd; hero.gather = null; gbar.style.display = 'none';
  const n = 1 + (Math.random() < 0.35 ? 1 : 0);
  addRes(nd.kind, nd.tier, n);
  nd.ready = T + 45;
  nums.push({ x: hero.x, y: hero.y - 120, t: 0, txt: `+${n} ${resName(nd.kind, nd.tier)}`, c: RES[nd.kind][nd.tier][1] });

}
function profTip(pid) {
  const pr = hero.profs[pid]; if (!pr || pr.r >= 5) return;
  if (questDone(pid) && !pr.told) { pr.told = true; toast(`📜 Misión de <b>${PROFS[pid].name}</b> lista: vuelve con ${trainerName(pid)} para subir de rango.`); }
}

/* ----------------------------------------------------------- profesiones */
const trainerName = (pid) => ({ bruno: 'el Pescador Bruno (estanque del pueblo)', greta: 'la Minera Greta (camino del este)', lia: 'Lía (oeste del pueblo)', chispa: 'la Ingeniera Chispa (en la posada)', amalia: 'la Doctora Amalia (la Consulta)', brunilda: 'Brunilda (la Herrería)', marta: 'Marta (la Posada)' }[PROFS[pid].trainer]);
function questDone(pid) {
  const pr = hero.profs[pid]; if (!pr || pr.r >= 5) return false;
  const q = profQuest(pid, pr.r);
  return q.kind === 'have' ? resN(q.res, q.tier) >= q.n : (pr.q || 0) >= q.n;
}
function questProg(pid) { const pr = hero.profs[pid], q = profQuest(pid, pr.r); return [Math.min(q.n, q.kind === 'have' ? resN(q.res, q.tier) : pr.q || 0), q.n]; }
function canCraft(R) { return R.needs.every(([k, t, n]) => resN(k, t) >= n); }
function craft(pid, t, j = 0) {
  const P = PROFS[pid], pr = hero.profs[pid], R = recipeList(pid, t)[j];
  if (!hero.tools[P.tool]) { toast(`Necesitas <b>${P.tool}</b>`); return; }
  if (!canCraft(R)) return;
  for (const [k, tt, n] of R.needs) addRes(k, tt, -n);
  if (R.gives.kind === 'food') { hero.food[R.gives.key] = (hero.food[R.gives.key] || 0) + R.gives.n; toast(`${FOOD[R.gives.key][1]} Has cocinado ${R.gives.n} × ${FOOD[R.gives.key][0]} (tecla 5 o botón 🍖 para comer)`); }

  else if (R.gives.kind === 'bombs') { hero.bombs += R.gives.n; toast(`💣 Has fabricado ${R.gives.n} bombas (tecla 4 o botón 💣)`); }
  else {
    if (hero.bag.length >= BAGMAX) { toast('Tu bolsa está llena'); for (const [k, tt, n] of R.needs) addRes(k, tt, n); return; }
    const rar = Math.min(4, t - 1 + (Math.random() < 0.25 ? 1 : 0)), w = makeWeapon(hero.cls, Math.max(hero.lvl, t * 4), rar);
    hero.bag.push(w); toast(`🔨 Has forjado <b style="color:${RARITY[rar].color}">${w.name}</b> (daño ${w.dmg})`);
  }
  if (t === pr.r) pr.q = (pr.q || 0) + 1;

  save(); renderBag(); openProfs();
}

let stock = null, stockLvl = 0;
function shopStock() {

    stock = [0, 1, 1, 2].map((r, i) => makeWeapon(hero.cls, hero.lvl + (i > 1 ? 1 : 0), r)); stock.cls = hero.cls; stockLvl = hero.lvl;

const wPrice = (w) => Math.round((w.dmg * 5 + 10) * (1 + w.rarity * 0.6));

const sellItem = (it) => (it.slot ? Math.max(2, Math.round(gearValue(it) * 0.25)) : sellW(it));

  } else if (tab === 'armor') {
    body += `<p class="sub">Piezas de ${ARMOR_NAME[maxArmor(hero.cls, hero.lvl)].toLowerCase()} para ti y joyas. Cambian cuando subes de nivel. ▲ = mejor que lo que llevas.</p>`;
    body += S.gear.map((g, i) => { const R = RARITY[g.rarity]; return `<div class="lrow"><img src="${gearIcon(g).toDataURL()}"><b style="color:${R.color}">${g.name}<small>${gearDesc(g)} · ${gearStats(g) || 'sin atributos'}${gearScore(g) > gearScore(hero.gear[g.slot]) ? ' <span class="up">▲</span>' : ''}</small></b><button class="ghost" data-bg="${i}">${gearValue(g)} 🪙</button></div>`; }).join('');

    body += res.map((r) => `<div class="lrow"><span class="li">${r.icon}</span><b style="color:${r.col}">${r.name}<small>×${r.n} · ${resPrice(r.t)} 🪙 cada uno</small></b><button class="ghost" data-sr="${r.kind}${r.t}">Vender 1</button><button class="ghost" data-sra="${r.kind}${r.t}">Todo</button></div>`).join('');

  });

/* comer */
function eatFood(pickKey) {
  if (!hero || hero.dead || !playing) return;
  const keys = Object.keys(hero.food).filter((k) => hero.food[k] > 0);
  if (!keys.length) { toast('No tienes comida. Cómprala a Tobías o aprende Cocina con Marta.'); return; }
  if ((hero.cd.food || 0) > T) { toast(`Aún estás comiendo (${Math.ceil(hero.cd.food - T)} s)`); return; }
  keys.sort((a, b) => (FOOD[b][3] - FOOD[a][3]) || FOOD[b][2] - FOOD[a][2]);
  const k = pickKey && hero.food[pickKey] ? pickKey : keys[0], F = FOOD[k]; hero.food[k]--; if (!hero.food[k]) delete hero.food[k];

function throwBomb() {

  fx.push({ k: 'bomb', x0: hero.x, y0: hero.y - 40, x: tx, y: ty - 10, t: 0, life: 0.45 });
  const dmg = 16 + hero.lvl * 2.5 + 8 * (hero.profs.ingenieria?.r || 1);

    fx.push({ k: 'ring', x: tx, y: ty, r: 100, t: 0, life: 0.5, c: '#ff9a3a' }); fx.push({ k: 'ring', x: tx, y: ty, r: 60, t: 0, life: 0.4, c: '#fff1a0' });

const SEEN_W = WORLD_W / 100, SEEN_H = WORLD_H / 100;
let SEEN = new Uint8Array(SEEN_W * SEEN_H), MAPBASE = null;
function initSeen() {
  SEEN = new Uint8Array(SEEN_W * SEEN_H); fogDirty = true;
  const s = hero.seen || '';
  for (let i = 0; i < s.length; i++) { const v = s.charCodeAt(i) - 48; for (let b = 0; b < 6; b++) if (v & (1 << b)) SEEN[i * 6 + b] = 1; }
}
function syncSeen() { let s = ''; for (let i = 0; i < SEEN.length; i += 6) { let v = 0; for (let b = 0; b < 6; b++) if (SEEN[i + b]) v |= 1 << b; s += String.fromCharCode(48 + v); } if (hero) hero.seen = s; }
function markSeen(x, y) {
  const ci = Math.floor(x / 100), cj = Math.floor(y / 100);
  for (let j = cj - 6; j <= cj + 6; j++) for (let i = ci - 8; i <= ci + 8; i++) if (i >= 0 && j >= 0 && i < SEEN_W && j < SEEN_H && ((i - ci) / 8) ** 2 + ((j - cj) / 6) ** 2 <= 1 && !SEEN[j * SEEN_W + i]) { SEEN[j * SEEN_W + i] = 1; fogDirty = true; }
}
function buildMapBase() {
  const k = 0.05, c = document.createElement('canvas'); c.width = WORLD_W * k; c.height = WORLD_H * k;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = true; x.drawImage(ZMAP, 0, 0, c.width, c.height);
  x.fillStyle = '#c9a46a'; for (let y = 0; y < WORLD_H; y += 40) for (let xx = 0; xx < WORLD_W; xx += 40) if (onPath(xx, y)) x.fillRect(xx * k - 1, y * k - 1, 3, 3);
  for (const L of LAKES) { x.beginPath(); x.ellipse(L.x * k, L.y * k, L.rx * k, L.ry * k, 0, 0, 7); x.fillStyle = '#4f8ac0'; x.fill(); x.lineWidth = 1.5; x.strokeStyle = '#2a2220'; x.stroke(); }
  x.fillStyle = '#2f5f3a'; for (const o of WORLD.objects) if (o.tree) x.fillRect(o.x * k - 1, o.y * k - 2, 2.4, 2.4);
  x.beginPath(); x.ellipse(CX * k, (CY + 60) * k, 40 * 0.8, 30 * 0.8, 0, 0, 7); x.fillStyle = '#e8d8a8'; x.fill(); x.lineWidth = 2; x.strokeStyle = '#6b4a22'; x.stroke();
  MAPBASE = c;
}
function drawMapTo(cn, x0, y0, w, h, big) {
  const x = cn.getContext('2d'), sx = cn.width / w, sy = cn.height / h, k = 0.05;
  x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = '#120c08'; x.fillRect(0, 0, cn.width, cn.height);
  x.imageSmoothingEnabled = true;
  x.drawImage(MAPBASE, x0 * k, y0 * k, w * k, h * k, 0, 0, cn.width, cn.height);
  // niebla suave: lo que aún no has visto
  const fc = fogCanvas();
  x.drawImage(fc, x0 / 100, y0 / 100, w / 100, h / 100, 0, 0, cn.width, cn.height);
  const P = (wx, wy) => [(wx - x0) * sx, (wy - y0) * sy];
  x.textAlign = 'center'; x.lineJoin = 'round';
  for (const p of PORTALS) if (hero.found.includes(p.i)) {
    const [px, py] = P(p.x, p.y);
    x.beginPath(); x.arc(px, py, big ? 9 : 5, 0, 7); x.fillStyle = p.col; x.fill(); x.lineWidth = 2; x.strokeStyle = '#fff'; x.stroke();
    if (big) { x.font = 'bold 13px Trebuchet MS'; x.lineWidth = 4; x.strokeStyle = '#2a2220'; const t = `${p.name} · Nv ${p.lvl}${hero.done[p.i] ? ' ✔' : ''}`; x.strokeText(t, px, py - 13); x.fillStyle = '#fff'; x.fillText(t, px, py - 13); }
  }
  if (big) {
    x.font = 'bold 15px Trebuchet MS';
    const lab = (t, wx, wy) => { const [px, py] = P(wx, wy); if (!SEEN[Math.floor(wy / 100) * SEEN_W + Math.floor(wx / 100)]) return; x.lineWidth = 4; x.strokeStyle = '#2a2220'; x.strokeText(t, px, py); x.fillStyle = '#ffd27a'; x.fillText(t, px, py); };

function fogCanvas() {

    }
    case 'heal': healHero(hero.max * ab.heal * R); fx.push({ k: 'ring', x: hero.x, y: hero.y - 10, r: 50, t: 0, life: 0.6, c: col }); break;
    case 'shield': hero.shield = { amt: hero.max * ab.abs * R, until: T + ab.dur, c: col }; toast(`${ab.icon} ${ab.name}: absorbes ${Math.round(hero.shield.amt)} de daño`); break;
    case 'buff':
      if (ab.up) hero.dmgUp = { v: ab.up * R, until: T + ab.dur };
      if (ab.speed) hero.speedUp = { v: ab.speed, until: T + ab.dur };
      if (ab.abs) hero.shield = { amt: hero.max * ab.abs * R, until: T + ab.dur, c: col };
      fx.push({ k: 'ring', x: hero.x, y: hero.y - 10, r: 70, t: 0, life: 0.6, c: col });
      nums.push({ x: hero.x, y: hero.y - 140, t: 0, txt: `${ab.icon} ${ab.name}`, c: col });
      break;
    case 'stealth':
      hero.stealth = T + ab.dur; hero.stealthMult = ab.mult * R;
      for (const m of mobs) if (m.state === 'chase') m.state = 'back';
      break;
  }
}
function updateZones(dt) {
  for (let i = zones.length - 1; i >= 0; i--) {
    const z = zones[i];
    if (z.follow) { z.x = hero.x; z.y = hero.y; hero.spin = 0.3; }
    if (T >= z.next) { z.next = T + 1; areaHit(z.x, z.y, z.r, z.ab, z.dmg); }
    if (T > z.until) zones.splice(i, 1);
  }
}
function drawZones(ctx) {
  for (const z of zones) {
    ctx.globalAlpha = 0.22 + Math.sin(T * 6) * 0.06; ctx.fillStyle = z.c;
    ctx.beginPath(); ctx.ellipse(z.x, z.y, z.r, z.r * 0.55, 0, 0, 7); ctx.fill();
    ctx.globalAlpha = 0.7; ctx.strokeStyle = z.c; ctx.lineWidth = 3; ctx.stroke();
    for (let k = 0; k < 5; k++) { const a = T * 2 + k * 1.26, rr = z.r * (0.3 + ((T + k * 0.2) % 1) * 0.6); ctx.beginPath(); ctx.arc(z.x + Math.cos(a) * rr, z.y + Math.sin(a) * rr * 0.55 - ((T * 60 + k * 13) % 30), 4, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
}

/* ------------------------------------------------------ libro de hechizos */
let bookSel = 0;
function openBook(sel = bookSel) {
  if (!playing) return;
  bookSel = sel;
  const list = ABILS[hero.cls], K = CLASSES[hero.cls];
  const slot = (i) => { const id = hero.abil.bar[i], ab = id && ABIL[id]; return `<button class="bslot ${i === sel ? 'on' : ''}" data-sel="${i}">${ab ? ab.icon : '＋'}<small>${i === 0 ? 'Básica' : 'Habilidad ' + (i + 1)}</small></button>`; };
  const row = (ab) => {
    const r = rankOf(ab.id), inBar = hero.abil.bar.indexOf(ab.id), fits = (sel === 0) === !!ab.basic;
    const btn = !r ? (hero.lvl >= ab.req ? '<em class="up">Apréndela con tu instructor</em>' : `<em class="down">Nivel ${ab.req}</em>`) : ab.kind === 'passive' ? '<em>Pasiva: siempre activa</em>' : inBar === sel ? '<em>Equipada</em>' : fits ? `<button class="ghost" data-put="${ab.id}">Equipar</button>` : '';
    return `<div class="lrow ${r ? '' : 'locked'}"><span class="li">${ab.icon}</span><b>${ab.name}${r ? ` <span class="rk">R${r}</span>` : ''}${inBar >= 0 ? ` <span class="up">[${inBar + 1}]</span>` : ''}<small>${abDesc(ab)}</small></b>${btn}</div>`;
  };
  const basics = list.filter((a) => a.basic), others = list.filter((a) => !a.basic);
  openWin(`${head(`📖 Habilidades de ${K.name}`)}<div class="wbody">
    <p class="sub">Llevas 5 habilidades: 1 ataque básico y 4 de clase. Elige una ranura y luego la habilidad. Las nuevas (y sus mejoras) te las enseña tu instructor en el Cuartel, en los niveles pares.</p>
    <div class="bbar">${[0, 1, 2, 3, 4].map(slot).join('')}</div>
    <h4>${sel === 0 ? 'Ataques básicos' : 'Habilidades de clase'} (${(sel === 0 ? basics : others).filter((a) => rankOf(a.id)).length}/${(sel === 0 ? basics : others).length} aprendidas)</h4>
    ${(sel === 0 ? basics : others).map(row).join('')}</div>`, true);
  bind('[data-sel]', (d) => openBook(+d.sel));
  bind('[data-put]', (d) => {
    const old = hero.abil.bar.indexOf(d.put); if (old >= 0) hero.abil.bar[old] = hero.abil.bar[sel];
    hero.abil.bar[sel] = d.put; buildBar(); save(); openBook(sel);
  });
}

/* ------------------------------------------------- instructor de clase */
function openClassTrainer(cls, n) {
  const K = CLASSES[cls];
  if (cls !== hero.cls) { openWin(`${head(n.V.name)}<div class="wbody"><p>Yo solo entreno a los <b>${K.icon} ${K.name}</b>. Busca a tu instructor de ${CLASSES[hero.cls].name}: está aquí mismo, en el Cuartel.</p></div>`); return; }
  const rows = ABILS[cls].slice().sort((a, b) => a.req - b.req).map((ab) => {
    const r = rankOf(ab.id);
    let btn;
    if (!r) btn = hero.lvl >= ab.req ? `<button class="ghost" data-learn="${ab.id}" ${hero.gold >= learnPrice(ab) ? '' : 'disabled'}>Aprender · ${learnPrice(ab)} 🪙</button>` : `<em class="down">Nivel ${ab.req}</em>`;
    else if (r >= 5) btn = '<em>Rango máximo</em>';
    else btn = hero.lvl >= rankLvl(ab) ? `<button class="ghost" data-rank="${ab.id}" ${hero.gold >= rankPrice(ab) ? '' : 'disabled'}>Rango ${r + 1} · ${rankPrice(ab)} 🪙</button>` : `<em class="down">R${r + 1} a nivel ${rankLvl(ab)}</em>`;
    return `<div class="lrow ${r || hero.lvl >= ab.req ? '' : 'locked'}"><span class="li">${ab.icon}</span><b>${ab.name}${r ? ` <span class="rk">R${r}</span>` : ''}${ab.basic ? ' <span class="rk b">básica</span>' : ''}<small>${abDesc(ab, Math.max(1, r))}</small></b>${btn}</div>`;
  }).join('');
  openWin(`${head(`${n.V.name} · ${n.V.title}`)}<div class="wbody"><p class="sub">Cada nivel par puedo enseñarte habilidades nuevas o subir de rango las que ya sabes (+20 % de efecto por rango). Luego equípalas en tu libro de habilidades (📖, tecla K).</p>
    <div class="lgo"><button class="ghost" data-book>📖 Abrir libro de habilidades</button></div>${rows}</div>`, true);
  bind('[data-book]', () => openBook(0));
  bind('[data-learn]', (d) => {
    const ab = ABIL[d.learn]; if (hero.gold < learnPrice(ab) || hero.lvl < ab.req) return;
    hero.gold -= learnPrice(ab); hero.abil.known[ab.id] = 1;
    const free = ab.kind === 'passive' ? -1 : hero.abil.bar.findIndex((x, i) => !x && (i === 0) === !!ab.basic);
    if (free >= 0) { hero.abil.bar[free] = ab.id; buildBar(); }
    fx.push({ k: 'ring', x: hero.x, y: hero.y - 10, r: 80, t: 0, life: 0.8, c: K.color });
    toast(`📖 Has aprendido <b>${ab.icon} ${ab.name}</b>${ab.dual ? '. Ya puedes ponerte una daga en la mano izquierda desde la bolsa' : free >= 0 ? ` y la has puesto en la ranura ${free + 1}` : '. Equípala en tu libro (K)'}`); save(); openClassTrainer(cls, n);
  });
  bind('[data-rank]', (d) => {
    const ab = ABIL[d.rank]; if (hero.gold < rankPrice(ab) || hero.lvl < rankLvl(ab)) return;
    hero.gold -= rankPrice(ab); hero.abil.known[ab.id]++;
    toast(`⭐ <b>${ab.name}</b> sube a rango ${hero.abil.known[ab.id]}`); save(); openClassTrainer(cls, n);
  });
}

'use strict';
/* ============================================================ arranque */
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  if (playing) update(dt);
  draw();
  if (playing) { hud(); if ((mmT -= dt) < 0) { mmT = 0.25; drawMinimap(); } } else drawPreview();
  requestAnimationFrame(frame);
}
buildWorld();
buildNpcs();
spawnMonsters();
spawnAnimals();
SC = WORLD; npcs = WORLD.npcs; mobs = WORLD.mobs;
buildMapBase();
resize();
renderCreator();
requestAnimationFrame(frame);
window.__px = { get hero() { return hero; }, get mobs() { return mobs; }, get SC() { return SC; }, use, opt, enterScene, enterPortal, enterDoor, nearAct, doAct, openShop, openProfs, PORTALS, WORLD, get T() { return T; } };

</script>
